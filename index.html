<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e8ecef; font-family: -apple-system, "PingFang SC", sans-serif; }
  #app { width: 100%; height: 100%; }
  canvas { display: block; }

  /* ===== 进入房间的白色幕布（替代旧进度条）：负责 ENTERING 时的淡入覆盖 + 揭幕淡出 ===== */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    background: #ffffff;
    transition: opacity .6s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }

  /* ===== Intro：自定义 ✊️ 光标（仅房屋区域，不依赖浏览器 cursor:url） ===== */
  #introCursor {
    position: fixed; z-index: 120; pointer-events: none; display: none;
    font-size: 40px; transform: translate(-50%, -50%);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.25));
  }
  /* ===== Intro 提示语（WAITING 房间准备中 / READY 轻点进入） ===== */
  #introHint {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    z-index: 110; padding: 10px 22px; border-radius: 24px;
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
    color: #3b4a56; font-size: 14px; letter-spacing: 1px;
    box-shadow: 0 4px 18px rgba(50,70,90,.12);
    opacity: 0; transition: opacity .5s ease; pointer-events: none; white-space: nowrap;
  }
  #introHint.show { opacity: 1; }

  /* ===== 底部 Room 加载进度条（极简，非大型 loading 页） ===== */
  #roomProgress {
    position: fixed; left: 0; bottom: 0; width: 100%;
    height: 4px; z-index: 130; opacity: 1;
    background: rgba(150,170,185,.18);   /* 浅灰蓝轨道 */
    transition: opacity .8s ease;
  }
  #roomProgress.done { opacity: 0; pointer-events: none; }
  #roomProgressBar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #7fd0e6, #2f7ba6);  /* 海盐蓝 */
    transition: width .25s ease;
  }
  #roomProgressLabel {
    position: fixed; right: 12px; bottom: 11px; z-index: 131;
    font-size: 11px; letter-spacing: .5px; color: #2f7ba6;
    opacity: .85; transition: opacity .8s ease; pointer-events: none;
  }
  #roomProgress.done #roomProgressLabel { opacity: 0; }

  #hint {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 50; padding: 10px 22px; border-radius: 24px;
    background: rgba(255,255,255,.72); backdrop-filter: blur(10px);
    color: #3b4a56; font-size: 13px; letter-spacing: 1px;
    box-shadow: 0 4px 18px rgba(50,70,90,.12);
    display: flex; gap: 16px; align-items: center; white-space: nowrap;
  }
  #hint b { color: #2f7ba6; font-weight: 600; }
  #hint .kbd {
    display: inline-block; padding: 1px 8px; border-radius: 6px;
    background: rgba(47,123,166,.12); border: 1px solid rgba(47,123,166,.25);
    font-size: 12px; color: #2f7ba6;
  }
  #mode-tag {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    z-index: 80; padding: 6px 16px; border-radius: 16px;
    background: rgba(255,255,255,.65); backdrop-filter: blur(8px);
    color: #2f7ba6; font-size: 12px; letter-spacing: 2px;
    opacity: 0; transition: opacity .4s ease; pointer-events: none;
  }
  #mode-tag.show { opacity: 1; }

  /* ===== 电脑点击：毛玻璃遮罩 + Win95 记事本窗口 ===== */
  #laptopOverlay {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    background: rgba(25,35,55,0); backdrop-filter: blur(0px);
    transition: opacity .45s ease, background .65s ease, backdrop-filter .65s ease;
  }
  #laptopOverlay.show {
    opacity: 1; pointer-events: auto;
    background: rgba(25,35,55,.20);
    backdrop-filter: blur(16px) saturate(1.15);
  }
  .np-window {
    width: min(900px, 90vw);
    background: #c6c6c6;
    border: 2px solid; border-color: #ffffff #6f6f6f #6f6f6f #ffffff;
    box-shadow: 4px 4px 0 rgba(0,0,0,.30), 0 24px 60px rgba(20,40,70,.35);
    transform: scale(.92) translateY(14px);
    transition: transform .5s cubic-bezier(.2,1.3,.4,1);
  }
  #laptopOverlay.show .np-window { transform: scale(1) translateY(0); }
  .np-title {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff; font-weight: 700; font-size: 14px; padding: 5px 8px;
  }
  .np-btns { display: flex; gap: 3px; }
  .np-btns i {
    font-style: normal; width: 22px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    background: #c6c6c6; border: 2px solid; border-color: #fff #6f6f6f #6f6f6f #fff;
    color: #000; font-size: 12px; cursor: pointer;
  }
  .np-menu {
    display: flex; gap: 18px; padding: 5px 10px;
    font-size: 13px; color: #222; border-bottom: 1px solid #9a9a9a;
  }
  .np-body {
    height: min(62vh, 540px); margin: 8px;
    background: #fff;
    border: 2px solid; border-color: #6f6f6f #fff #fff #6f6f6f;
  }

  /* ===== 物品浮层：毛玻璃背景 + 主体图片（书本/唱片机/打字机共用） ===== */
  #booksOverlay, #recordOverlay, #typeOverlay {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    background: rgba(240,247,255,0); backdrop-filter: blur(0px);
    transition: opacity .45s ease, background .5s ease, backdrop-filter .5s ease;
  }
  #booksOverlay.show, #recordOverlay.show, #typeOverlay.show {
    opacity: 1; pointer-events: auto;
    background: rgba(240,247,255,.10);
    backdrop-filter: blur(18px) saturate(1.1);
  }
  /* ===== 物品浮层：毛玻璃背景 + SVG 矢量重构主体（书本/唱片机/打字机，与电脑记事本同路径） ===== */
  #booksOverlay svg, #recordOverlay svg, #typeOverlay svg {
    width: min(420px, 58vw); height: auto;
    transform: scale(.78);
    transition: transform .5s cubic-bezier(.2,1.5,.4,1);
    filter: drop-shadow(0 24px 50px rgba(40,70,110,.35));
  }
  #booksOverlay.show svg, #recordOverlay.show svg, #typeOverlay.show svg { transform: scale(1); }
  /* 打字机：大图展示，底边与页面底边重合 */
  #typeOverlay { align-items: flex-end; }
  #typeOverlay svg { height: min(112vh, 220vw); width: auto; margin-bottom: -5vh; }
  #recordOverlay svg { width: min(440px, 60vw); }

  #musicToast {
    position: fixed; left: 50%; bottom: 86px; z-index: 70;
    transform: translateX(-50%) translateY(10px);
    padding: 9px 20px; border-radius: 22px;
    background: rgba(30,40,55,.78); backdrop-filter: blur(6px);
    color: #fff; font-size: 13px; letter-spacing: 1px;
    opacity: 0; transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
  }
  #musicToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

/* ================= 3D 房屋坠落 Intro（与房间加载并行，不阻塞房间） =================
   设计要点：
   - 独立 introScene / introCamera，白底、无后处理（轻量，不引入 Rapier/GSAP 等第二套框架）。
   - 房屋用「手动 Euler 积分」实现坠落物理（参数见 introConfig）。
   - 状态机：LOADING→DROP→SETTLING→MAILBOX_REVEAL→CAMERA_DOLLY→WAITING→READY→ENTERING→ROOM
   - 房间后台加载，roomReady 后才允许 READY→进入。
   ================================================================================ */
const introConfig = {
  // —— 物理（手动积分；要真实刚体可改引 Rapier，但会引入第二套框架，按需求保持单框架）——
  houseStartHeight: 5.0,    // 起始坠落高度（距落点上方），调大=掉得更狠/更久
  gravity: 15,              // 重力加速度（越大落得越快）
  restitution: 0.22,        // 落地回弹系数（0=不弹，0.3=轻微弹）
  linearDamping: 0.4,       // 线性阻尼（空气阻力感）
  angularDamping: 6.5,      // 角阻尼（抑制翻滚，越大越稳）
  settleThreshold: 0.12,    // 视为静止的速度阈值
  settleTime: 0.45,         // SETTLING 阶段停留时间（s）
  // —— 邮箱（确定性动画，不用物理）——
  mailboxRotationStart: -1.25, // 入场起始旋转（弧度，约 -72°）
  mailboxRotationEnd: 0,       // 最终旋转
  mailboxAnimDur: 0.7,         // 邮箱弹出时长（s），含 overshoot
  mailboxScale: 1,
  mailboxHeightRatio: 0.40, // 邮箱目标高度 ≈ 房屋高度 40%（辅助物件，明显小于房屋）
  // —— 房屋悬停 / 敲门 ——
  houseHoverScale: 1.03,    // READY 悬停放大倍数
  knockDuration: 0.26,      // 点击后敲门震动时长（s）
  // —— 阴影（groundMat.opacity 随高度在 [shadowOpacityFar, shadowOpacityNear] 间插值）——
  shadowOpacityNear: 0.34,  // 近地阴影（深）
  shadowOpacityFar: 0.06,   // 高空阴影（淡）
  // —— 相机运镜：落地后“摄影机走近房子”，而非“房子被放大 / 抬升” ——
  cameraFocusHeightRatio: 0.43, // 稳定焦点高度 = restY + H*ratio（位于房屋几何中心略下方）
  cameraHoldAfterLanding: 0.30, // 落地后保持远景不变的时间（s），避免落地瞬间重新构图
  cameraDollyDuration: 1.5,     // 推镜（CAMERA_DOLLY）时长（s）
  cameraDollyForward: 0.72,     // 终点相对起点沿前进方向的比例（Z 明显前进，产生透视 / Parallax）
  cameraDollyDrop: 0.20,        // 推镜过程相对起点高度的下降比例（轻微下降，不俯冲）
  cameraDollySide: 0.35,        // 向房屋 + 邮箱方向横移比例
  cameraPathCurve: 'catmull',   // 路径插值方式（CatmullRomCurve3 + easeInOutCubic）
  cameraFarDistance: 6,            // 远景机位 Z 距离（落地后房屋完整可见）
  cameraFarTargetBelowFocus: 0,    // 远景注视点 = 房屋几何中心（houseRestY）：落地后房屋主体位于页面正中（≈50% Y），不故意向下看
  cameraCloseDistanceRatio: 2.15,  // 推镜终点距离 = H * ratio（正视机位下房屋正面轮廓占屏高 ≈66%，落在 55%~70% 验收带内）
  cameraCloseHeightRatio: 0,       // Closeup 相机高度 = houseRestY + H*ratio（0 = 与房屋中心等高 → 正视，不俯视）
  houseScreenTargetY: 0.50,        // 房屋视觉中心目标位置 = viewport 50% Y（验收参考，靠相机构图实现）
  closeupHouseScreenHeight: 0.62,  // Closeup 房屋目标占屏高（验收参考，主要靠 cameraCloseDistanceRatio 调整）
  progressBarHeight: 4,            // 底部 Room 加载进度条高度（px）
  // —— 手动覆盖机位（留空则按房屋尺寸自动计算；填 THREE.Vector3 覆盖）——
  farCameraPos: null, farTarget: null,
  closeupCameraPos: null, closeupTarget: null,
  cameraDamping: 0.0016,    // 仅 LOADING 阶段相机插值阻尼（DOLLY 改用明确时长，不受此影响）
};

const introLoader = new GLTFLoader();
introLoader.load('./toyhouse_20260918.glb', (g) => {
  house = g.scene;

  houseVel.set(0, 0, 0);

  introScene.add(house);

introLoader.load('./postbox_20260918.glb', (g) => {
  mailbox = g.scene;
  mailbox.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const mb = new THREE.Box3().setFromObject(mailbox);
  const mbSize = mb.getSize(new THREE.Vector3());
  const mbCenter = mb.getCenter(new THREE.Vector3());
  // 邮筒按房屋高度缩放：目标高度 ≈ 房屋高度的 mailboxHeightRatio（辅助物件，明显小于房屋）
  mailboxTargetScale = (houseSize.y * introConfig.mailboxHeightRatio) / Math.max(0.0001, mbSize.y);
  // 紧贴房屋右前方：按两者半宽/半深留出合理小间隙（邮箱缩小后同步收近距离，避免过度留白）
  mailMX = houseSize.x * 0.5 + mbSize.x * mailboxTargetScale * 0.5 + 0.10;
  mailMZ = houseSize.z * 0.30 + mbSize.z * mailboxTargetScale * 0.5 + 0.10;
  // 用 pivot 包一层，把旋转/缩放轴放到邮筒"底面中心"，避免绕偏心点甩动
  mailbox.position.set(-mbCenter.x, -mb.min.y, -mbCenter.z);
  mailboxPivot = new THREE.Group();
  mailboxPivot.add(mailbox);
  mailboxPivot.position.set(mailMX, 0, mailMZ);
  mailboxPivot.rotation.y = introConfig.mailboxRotationStart;
  mailboxPivot.scale.setScalar(0.0001);
  introScene.add(mailboxPivot);
  INTRO.mailReady = true;
  INTRO.debug = Object.assign(INTRO.debug || {}, { mail: { x: mailMX, z: mailMZ }, mailH: mbSize.y, mbScale: mailboxTargetScale });
}, undefined, (e) => console.warn('邮箱加载失败:', e.message));

function computeIntroCameras() {
  const H = houseSize.y;
  // 落地后房屋几何中心（世界 Y）＝ 底部 restY + H/2。注意：本模型 restY 是“底面”而非中心。
  const houseCenterY = houseRestY + H * 0.5;
  // 稳定焦点：位于房屋几何中心略下方（= restY + H*ratio），全程不随阶段重算
  const focusY = houseRestY + H * introConfig.cameraFocusHeightRatio;
  INTRO.focusY = focusY;
  const far = introCameras.far, farTgt = introCameras.farTgt;
  // 远景机位（DROP/SETTLING/MAILBOX 共用）：注视房屋几何中心 → 落地后房屋整体位于页面正中（≈50% Y），
  // 不随阶段重算、不重新构图（cameraFarTargetBelowFocus=0 即注视房屋中心）。
  far.set(0, focusY + 3.2, introConfig.cameraFarDistance);
  farTgt.set(0, houseCenterY - introConfig.cameraFarTargetBelowFocus, 0);
  // 推镜终点（房屋 + 邮箱正面近景）：相机正对房屋、x≈0；高度与房屋中心等高（正视，不俯视），
  // 房屋中心保持屏幕正中 → 上下留白一致；邮箱自然落在右侧（不向右偏）。
  const closeDist = Math.max(H * introConfig.cameraCloseDistanceRatio, 1.4);
  introCameras.closeup.set(0, houseCenterY + H * introConfig.cameraCloseHeightRatio, closeDist);
  introCameras.closeupTgt.set(0, houseCenterY, 0);
  // 手动覆盖（如填写则优先）
  if (introConfig.farCameraPos) far.copy(introConfig.farCameraPos);
  if (introConfig.farTarget) farTgt.copy(introConfig.farTarget);
  if (introConfig.closeupCameraPos) introCameras.closeup.copy(introConfig.closeupCameraPos);
  if (introConfig.closeupTarget) introCameras.closeupTgt.copy(introConfig.closeupTarget);
  // 房屋尚未正式开始 DROP 前，先把相机放到远景机位
  if (INTRO.phase === 'LOADING') {
    introCamera.position.copy(far);
    introCamCurTgt.copy(farTgt);
    introCamera.lookAt(farTgt);
  }
}

function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

function introPhysics(dt) {
  houseVel.y -= introConfig.gravity * dt;
  houseVel.multiplyScalar(Math.max(0, 1 - introConfig.linearDamping * dt));
  house.position.addScaledVector(houseVel, dt);
  house.rotation.x += houseAngVel.x * dt;
  house.rotation.y += houseAngVel.y * dt;
  house.rotation.z += houseAngVel.z * dt;
  houseAngVel.multiplyScalar(Math.max(0, 1 - introConfig.angularDamping * dt));
  if (house.position.y <= houseRestY) {
    house.position.y = houseRestY;
    houseVel.y = (Math.abs(houseVel.y) > introConfig.settleThreshold) ? -houseVel.y * introConfig.restitution : 0;
  }
  if (house.position.y <= houseRestY + 0.002 && houseVel.length() < introConfig.settleThreshold && houseAngVel.length() < 0.06) {
    if (INTRO.phase === 'DROP') { setIntroPhase('SETTLING'); INTRO.settleTimer = 0; }
  }
}
function introSettle(dt) {
  INTRO.settleTimer += dt;
  house.rotation.x += (0 - house.rotation.x) * 0.12;
  house.rotation.z += (0 - house.rotation.z) * 0.12;
  house.rotation.y += (0 - house.rotation.y) * 0.08;
  if (INTRO.settleTimer > introConfig.settleTime) { setIntroPhase('MAILBOX_REVEAL'); INTRO.mailAnimStart = INTRO.t; }
}
function animMailbox() {
  if (!mailboxPivot) return;
  const t = THREE.MathUtils.clamp((INTRO.t - INTRO.mailAnimStart) / introConfig.mailboxAnimDur, 0, 1);
  const e = easeOutBack(t);
  mailboxPivot.scale.setScalar(Math.max(0.0001, e) * mailboxTargetScale * introConfig.mailboxScale);
  mailboxPivot.rotation.y = THREE.MathUtils.lerp(introConfig.mailboxRotationStart, introConfig.mailboxRotationEnd, easeOutCubic(t));
  if (t >= 1 && !INTRO.mailDone) { INTRO.mailDone = INTRO.t; }   // 邮箱完成：仅记录首次完成时刻，稍后（cameraHoldAfterLanding）再推镜
}

function updateIntroShadows() {
  // 阴影随高度：高则淡软，近地则收紧加深
  if (house) {
    const above = Math.max(0, house.position.y - houseRestY);
    const f = THREE.MathUtils.clamp(above / Math.max(0.001, introConfig.houseStartHeight), 0, 1);
    groundMat.opacity = THREE.MathUtils.lerp(introConfig.shadowOpacityNear, introConfig.shadowOpacityFar, f);
  }
}

function updateIntro(dt) {
  INTRO.t += dt;
  // cameraDamping 仅用于 LOADING 阶段的轻微插值；其余阶段相机由各自逻辑直接设定。
  const cc = 1 - Math.pow(introConfig.cameraDamping, dt);
  let pos = introCameras.far, tgt = introCameras.farTgt;
  switch (INTRO.phase) {
    case 'LOADING':
      pos = introCameras.far; tgt = introCameras.farTgt; break;
    case 'DROP':
      introPhysics(dt); pos = introCameras.far; tgt = introCameras.farTgt; break;
    case 'SETTLING': {
      introPhysics(dt); introSettle(dt);
      pos = introCameras.far; tgt = introCameras.farTgt;
      // 落地瞬间极轻微的“重量感”下沉（幅度极小、约 0.14s，不重新构图、不产生明显 jump）
      const se = INTRO.t - INTRO.phaseStart;
      if (se < 0.14) { const dip = Math.sin(se / 0.14 * Math.PI) * 0.015; pos = pos.clone(); pos.y -= dip; }
      break;
    }
    case 'MAILBOX_REVEAL':
      if (INTRO.mailReady) animMailbox();
      // 邮箱完成后，再保持远景 cameraHoldAfterLanding 秒，避免落地后立即重新构图
      if (INTRO.mailDone && INTRO.t - INTRO.mailDone >= introConfig.cameraHoldAfterLanding) setIntroPhase('CAMERA_DOLLY');
      pos = introCameras.far; tgt = introCameras.farTgt; break;
    case 'CAMERA_DOLLY': {
      // 进入时记录真实起点（= 当前远景机位）与终点，构建空间路径。不依赖“无限 lerp 到预设”。
      if (dolly.builtAt !== INTRO.phaseStart) {
        dolly.startPos.copy(introCamera.position);
        dolly.startTgt.copy(introCamCurTgt);
        dolly.endPos.copy(introCameras.closeup);
        dolly.endTgt.copy(introCameras.closeupTgt);
        const toEnd = dolly.endPos.clone().sub(dolly.startPos);
        const p0 = dolly.startPos.clone();
        const p1 = dolly.startPos.clone().addScaledVector(toEnd, introConfig.cameraDollyForward * 0.4);
        p1.y -= (dolly.startPos.y - dolly.endPos.y) * introConfig.cameraDollyDrop * 0.5;   // 前进中略降
        const p2 = dolly.startPos.clone().addScaledVector(toEnd, 0.65);
        p2.x += (dolly.endPos.x - dolly.startPos.x) * introConfig.cameraDollySide;         // 向房屋+邮箱横移
        p2.y -= (dolly.startPos.y - dolly.endPos.y) * introConfig.cameraDollyDrop * 0.5;   // 继续略降
        dolly.curve = new THREE.CatmullRomCurve3([p0, p1, p2, dolly.endPos.clone()]);
        dolly.builtAt = INTRO.phaseStart;
      }
      const t = THREE.MathUtils.clamp((INTRO.t - INTRO.phaseStart) / introConfig.cameraDollyDuration, 0, 1);
      const e = easeInOutCubic(t);                 // 前缓·中快·尾缓，无回弹
      introCamera.position.copy(dolly.curve.getPoint(e));
      introCamCurTgt.copy(dolly.startTgt).lerp(dolly.endTgt, e);  // 注视点稳定跟随 groundedFocusPoint
      introCamera.lookAt(introCamCurTgt);
      updateIntroShadows();
      if (t >= 1) { setIntroPhase('WAITING'); setIntroHint('房间准备中…'); }
      return;  // DOLLY 已直接设置相机，跳过底部通用 lerp
    }
    case 'WAITING':
      pos = introCameras.closeup; tgt = introCameras.closeupTgt;
      if (INTRO.roomReady) { setIntroPhase('READY'); setIntroHint('轻点小屋，推门而入 🏠'); }
      break;
    case 'READY':
      pos = introCameras.closeup; tgt = introCameras.closeupTgt;
      { const target = INTRO.houseHovered ? introConfig.houseHoverScale : 1;
        house.scale.lerp(new THREE.Vector3(target, target, target), 0.18); }
      break;
    case 'ENTERING': {
      const e = INTRO.t - INTRO.enterStart;
      const kd = introConfig.knockDuration;
      if (e < kd) { const f = 1 - e / kd; house.rotation.z = Math.sin(e / kd * Math.PI * 4) * 0.05 * f; house.position.x = Math.sin(e / kd * Math.PI * 6) * 0.03; }
      else { house.rotation.z = 0; house.position.x = 0; }
      pos = introCameras.closeup.clone();
      const push = THREE.MathUtils.clamp((e - kd) / 0.4, 0, 1);
      const hc = new THREE.Vector3(0, houseRestY + houseLocalCenter.y, 0);
      pos.lerp(hc, push * 0.15);
      tgt = introCameras.closeupTgt;
      if (!INTRO.curtainIn && e > kd + 0.12) { INTRO.curtainIn = true; loadingEl.style.opacity = '1'; }
      if (INTRO.curtainIn && !INTRO.swapped && e > kd + 0.78) {
        INTRO.swapped = true;
        loadingEl.style.opacity = '0';   // 揭幕：白色幕布淡出，露出已预加载的房间
        camera.position.copy(HOME.base); camera.lookAt(HOME.target);
        if (hintEl) hintEl.style.display = 'flex';   // 进入房间：显示操作提示条
        setIntroPhase('ROOM');
      }
      break;
    }
  }
  introCamera.position.lerp(pos, cc);
  introCamCurTgt.lerp(tgt, cc);
  introCamera.lookAt(introCamCurTgt);
  updateIntroShadows();
}

/* ================= 音乐：Web Audio 合成 lo-fi 循环 ================= */
let AC = null, musicMaster = null, musicTimer = null, musicStep = 0;
const CHORDS = [
  [174.6, 220.0, 261.6, 329.6],  // Fmaj7
  [146.8, 174.6, 220.0, 293.7],  // Dm7
  [155.6, 196.0, 233.1, 293.7],  // Ebmaj7
  [130.8, 164.8, 196.0, 246.9]   // Cm7
];
const MELODY = [0, 2, 1, 3, 2, 1, 3, 0, 1, 3, 0, 2, 3, 2, 0, 1];
function playNote(freq, t, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(musicMaster);
  o.start(t); o.stop(t + dur + 0.05);
}
function toggleMusic() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    musicMaster = AC.createGain(); musicMaster.gain.value = 0.5;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    musicMaster.connect(lp); lp.connect(AC.destination);
    /* 黑胶底噪 */
    const len = 2 * AC.sampleRate;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = last * 3; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const ng = AC.createGain(); ng.gain.value = 0.045;
    src.connect(ng); ng.connect(musicMaster); src.start();
  }
  state.musicOn = !state.musicOn;
  if (state.musicOn) {
    AC.resume();
    musicMaster.gain.setTargetAtTime(0.5, AC.currentTime, 0.15);
    clearInterval(musicTimer);
    musicTimer = setInterval(() => {
      const t = AC.currentTime + 0.06;
      const chord = CHORDS[Math.floor(musicStep / 8) % 4];
      if (musicStep % 8 === 0) chord.forEach(f => playNote(f / 2, t, 3.4, 'sine', 0.10));
      playNote(chord[MELODY[musicStep % 16]] * 2, t, 0.5, 'triangle', 0.07);
      musicStep++;
    }, 330);
    toast('🎵 唱片机播放中 · 再点一次停止');
  } else {
    clearInterval(musicTimer);
    musicMaster.gain.setTargetAtTime(0, AC.currentTime, 0.2);
    toast('⏸ 音乐已停止');
  }
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('musicToast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

const roomLoadProgress = {};                 // url -> {loaded, total}
let roomProgressShown = 0;                   // 已显示过的最大百分比（进度条只增不减）
const roomLoadingManager = new THREE.LoadingManager();
function onRoomProgress(url, xhr) {
  if (!xhr) return;
  roomLoadProgress[url] = { loaded: xhr.loaded || 0, total: xhr.total || 0 };
  let L = 0, T = 0;
  for (const k in roomLoadProgress) { L += roomLoadProgress[k].loaded; T += roomLoadProgress[k].total; }
  setRoomProgress(T > 0 ? Math.round(L / T * 100) : 0);
}
function setRoomProgress(pct) {
  pct = Math.max(0, Math.min(100, pct));
  // 进度条只增不减：主 GLB 先完成、家具后续加入时会把分母抬高使原始比值回退，
  // 这里取历史最大值，避免出现 97% → 37% 的倒退（仍完全由真实 xhr.loaded/total 驱动）。
  if (pct < roomProgressShown) pct = roomProgressShown; else roomProgressShown = pct;
  const wrap = document.getElementById('roomProgress');
  const bar = document.getElementById('roomProgressBar');
  const label = document.getElementById('roomProgressLabel');
  if (wrap) wrap.style.height = introConfig.progressBarHeight + 'px';
  if (bar) bar.style.width = pct + '%';
  if (label) label.textContent = 'Loading room ' + pct + '%';
}
function fadeRoomProgress() {
  const wrap = document.getElementById('roomProgress');
  const bar = document.getElementById('roomProgressBar');
  roomProgressShown = 100;
  if (bar) bar.style.width = '100%';

}

/* ================= 命中分类 ================= */
function ancestorName(obj, re) {
  let n = obj;
  while (n) { if (re.test(n.name || '')) return true; n = n.parent; }
  return false;
}
const WINDOW_WORLD = new THREE.Vector3(5.84, 2.68, -0.95);
const WINDOW_CLICK_RADIUS = 90;
function windowScreenPos() {
  const p = WINDOW_WORLD.clone().project(camera);
  if (p.z > 1) return null;
  return [ (p.x + 1) / 2 * window.innerWidth, (1 - p.y) / 2 * window.innerHeight ];
}
function nearWindowOnScreen(mx, my) {
  const s = windowScreenPos();
  if (!s) return false;
  return Math.hypot(mx - s[0], my - s[1]) < WINDOW_CLICK_RADIUS;
}
function classifyHit(hit) {
  const o = hit.object;
  if (ancestorName(o, /^Lamp_/)) return 'lamp';
  if (ancestorName(o, /^Window/)) return 'window';
  return null;
}

/* ================= 悬停发光 + 放大 ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let mouseNX = 0, mouseNY = 0;
let hovered = null;
const _hv = new THREE.Vector3();

function updatePointer(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  mouseNX = pointer.x; mouseNY = pointer.y;
}
/* 光线-包围球求交，取最近者（比逐网格射线快得多） */
function pickItem() {
  raycaster.setFromCamera(pointer, camera);
  let best = null, bestD = Infinity;
  for (const it of interactables) {
    const p = raycaster.ray.intersectSphere(it.sphere, _hv);
    if (p) {
      const d = p.distanceTo(camera.position);
      if (d < bestD) { bestD = d; best = it; }
    }
  }
  return best;
}
function setHover(it) {
  if (hovered === it) return;
  if (hovered) hovered.group.scale.setScalar(hovered.group.userData.baseScale || 1);
  hovered = it;
  if (it) {
    it.group.scale.setScalar(1.05);
    outlinePass.selectedObjects = [it.group];
  } else {
    outlinePass.selectedObjects = [];
  }
}

function cameraSettled() {
  return camera.position.distanceTo(desiredPos) < 0.08;
}

window.addEventListener('mousemove', (e) => {
  updatePointer(e);
  if (INTRO.phase !== 'ROOM') { handleIntroMouse(e); return; }   // Intro 阶段：仅做房屋悬停检测
  if (!model) { renderer.domElement.style.cursor = 'default'; return; }   // 模型未就绪时不做拾取
  if (state.mode !== 'home') { setHover(null); renderer.domElement.style.cursor = 'default'; return; }

    || nearWindowOnScreen(e.clientX, e.clientY)
    || (() => { raycaster.setFromCamera(pointer, camera); return raycaster.intersectObject(model, true).slice(0, 3).some(h => { const k = classifyHit(h); return k === 'lamp' || k === 'window'; }); })();
  renderer.domElement.style.cursor = clickable ? 'pointer' : 'default';
});

/* 边缘缓动：中间死区不动，靠近边缘才产生视角跟随（smoothstep 平滑加速） */
const EDGE_ZONE = 0.22;
function edgePan(v) {
  const a = Math.abs(v);
  if (a <= EDGE_ZONE) return 0;
  const t = (a - EDGE_ZONE) / (1 - EDGE_ZONE);
  return Math.sign(v) * t * t * (3 - 2 * t);
}
/* 鼠标离开窗口 → 视角回正 */
document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) { mouseNX = 0; mouseNY = 0; } });

window.addEventListener('click', (e) => {
  if (INTRO.phase !== 'ROOM') { if (INTRO.phase === 'READY') startEntering(); return; }  // Intro：READY 点击进入
  if (!model) return;
  updatePointer(e);
  if (state.mode !== 'home') return;   // 覆盖层自身的点击由 DOM 处理
  const it = pickItem();
  if (it) {
    enterItem(it.kind);   // laptop/books/record/typewriter 统一：镜头拉近 + 毛玻璃弹层
    return;
  }
  if (!cameraSettled()) return;
  if (nearWindowOnScreen(e.clientX, e.clientY)) { setSun(!state.sunOn); return; }
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(model, true);
  if (!hits.length) return;
  const kind = hits.slice(0, 3).map(h => classifyHit(h)).find(k => k) || classifyHit(hits[0]);
  if (kind === 'lamp') setLamps(!state.lampsOn);
  else if (kind === 'window') setSun(!state.sunOn);
});

window.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (state.mode !== 'home') goHome();
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.mode !== 'home') goHome();
});
document.getElementById('npClose').addEventListener('click', goHome);
document.getElementById('laptopOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('laptopOverlay')) goHome();
});
['booksOverlay', 'recordOverlay', 'typeOverlay'].forEach(id => {
  document.getElementById(id).addEventListener('click', goHome);
});

/* ================= 动画循环 ================= */
const desiredPos = HOME.base.clone();
const desiredTgt = HOME.target.clone();
const curTarget = HOME.target.clone();
const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  /* Intro 阶段：渲染独立白底场景；进入 ROOM 后落到下面的房间分支 */
  if (INTRO.phase !== 'ROOM') {
    updateIntro(dt);
    if (INTRO.phase !== 'ROOM') { renderer.render(introScene, introCamera); return; }
  }

  const k = 1 - Math.pow(0.0015, dt);

  if (state.mode === 'home') {
    const ex = edgePan(mouseNX), ey = edgePan(mouseNY);
    const px = THREE.MathUtils.clamp(ex * ORBIT.x, -ORBIT.x, ORBIT.x);
    const py = THREE.MathUtils.clamp(HOME.base.y + ey * 1.3, ORBIT.yMin, ORBIT.yMax);
    const pz = THREE.MathUtils.clamp(HOME.base.z - Math.abs(ex) * 0.9, ORBIT.zMin, ORBIT.zMax);
    desiredPos.set(px, py, pz);
    desiredTgt.set(THREE.MathUtils.clamp(ex * ORBIT.tgtX, -ORBIT.tgtX, ORBIT.tgtX), HOME.target.y, 0);
  } else if (ITEM_CAMS[state.mode] && ITEM_CAMS[state.mode].pos) {
    desiredPos.copy(ITEM_CAMS[state.mode].pos);
    desiredTgt.copy(ITEM_CAMS[state.mode].tgt);
  }
  /* 各特写模式镜头 lerp 到对应机位后停住 */

  camera.position.lerp(desiredPos, k);
  curTarget.lerp(desiredTgt, k);
  camera.lookAt(curTarget);
  /* 相机每帧都在动，悬停拾取必须逐帧刷新，否则状态过期（书本滑出光标下仍显示发光） */
  if (state.mode === 'home' && model) {
    camera.updateMatrixWorld();
    setHover(pickItem());
    renderer.domElement.style.cursor = (hovered
      || nearWindowOnScreen((mouseNX + 1) / 2 * window.innerWidth, (1 - mouseNY) / 2 * window.innerHeight)) ? 'pointer' : 'default';
  }
  composer.render();
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  introCamera.aspect = window.innerWidth / window.innerHeight;
  introCamera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
